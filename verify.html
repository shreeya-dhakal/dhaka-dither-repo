      bdoc.querySelector('[data-i18n="reason.brailleLevels"]').hidden, false);
    check("braille disables Color",
      bdoc.querySelector('#outputMode option[value="color"]').disabled, true);
    check("and shows why too",
      bdoc.querySelector('[data-i18n="reason.brailleColor"]').hidden, false);
    check("mono and duo stay available",
      [bdoc.querySelector('#outputMode option[value="mono"]').disabled,
       bdoc.querySelector('#outputMode option[value="duo"]').disabled], [false, false]);
    check("the dot controls appear", bdoc.querySelector('[data-when="braille"]').hidden, false);

    // The cell ratio follows the mode through the same path the font uses.
    check("braille takes a 2.0 cell ratio", Number(bdoc.getElementById("cellAspect").value), 2);
    bfire("text", "ramp");
    check("and hands it back to the face's ratio on leaving",
      Number(bdoc.getElementById("cellAspect").value), 1.35);

    // A hand-set ratio is not overwritten by either default.
    const aspect = bdoc.getElementById("cellAspect");
    aspect.value = "1.7";
    aspect.dispatchEvent(new bframe.contentWindow.Event("input", { bubbles: true }));
    bfire("text", "braille");
    check("but a ratio the user set by hand stands", Number(aspect.value), 1.7);

    // Braille displaces a Color selection; leaving braille must give it back.
    // Forcing a choice and then keeping it is how a user concludes the feature
    // vanished — which is exactly how this was found.
    bfire("text", "ramp");
    bfire("outputMode", "color");
    check("Color is selectable in density mode", bdoc.getElementById("outputMode").value, "color");
    bfire("text", "braille");
    check("braille displaces it", bdoc.getElementById("outputMode").value, "mono");
    bfire("text", "ramp");
    check("and leaving braille hands it back", bdoc.getElementById("outputMode").value, "color");

    // A deliberate choice made while in braille is not overwritten.
    bfire("text", "braille");
    bfire("outputMode", "duo");
    bfire("text", "ramp");
    check("but a choice made under the constraint stands",
      bdoc.getElementById("outputMode").value, "duo");

    // Halftone: the mode select stays live because Color does something, but
    // the duo pickers hide — the pair on offer under halftone is its own, and
    // showing two ink pairs at once is how a user picks the one that is
    // ignored. `levels` still disables, since dot area carries the tone.
    bfire("text", "off");
    bfire("algorithm", "halftone");
    check("halftone leaves the mode select live",
      [bdoc.querySelector('#outputMode option[value="mono"]').disabled,
       bdoc.querySelector('#outputMode option[value="duo"]').disabled,
       bdoc.querySelector('#outputMode option[value="color"]').disabled], [false, false, false]);
    check("and explains what the modes mean here",
      bdoc.querySelector('[data-i18n="reason.halftoneMode"]').hidden, false);
    check("halftone still disables levels",
      bdoc.querySelector('[data-disable="levelsInert"] input').disabled, true);
    bfire("outputMode", "duo");
    check("the duo pickers stay hidden under halftone",
      bdoc.querySelector('[data-when="inkPair"]').hidden, true);
    check("halftone shows its own ink pair instead",
      bdoc.querySelector('[data-when="halftone"]').hidden, false);
    bfire("algorithm", "bayer");
    check("and duo gets its pickers back on leaving halftone",
      bdoc.querySelector('[data-when="inkPair"]').hidden, false);

    bframe.remove();

    // A link has to restore what it carried. The unit tests cover the format;
    // this covers the wiring — that the controls are written back on load, and
    // that a clean load leaves the address bar clean instead of listing every
    // default and making an unshareable link.
    //
    // Its own frame, deliberately: the one above has been driven through every
    // check on this page, so "clean" would be measuring that history instead.
    stage("layout and URL state");
    const openFrame = async (src, size = "width:400px;height:520px") => {
      const frame = document.createElement("iframe");
      frame.src = src;
      frame.style.cssText = `${size};border:1px solid #000`;
      document.body.append(frame);
      await new Promise((resolve) => frame.addEventListener("load", resolve));
      // Long enough for the font gate: the settings from a link are applied
      // after it, and a shorter wait measures the app mid-startup.
      await new Promise((resolve) => setTimeout(resolve, 2500));
      return frame;
    };

    /**
     * The rail must be its own scroller, not the page's.
     *
     * Grid items default to `min-height: auto`, so a rail taller than the
     * viewport stretches its row instead of scrolling — and the stage, sharing
     * that row, grows with it and centres the picture below the fold. Reaching
     * for the algorithm then scrolled the video off screen, which is exactly
     * what was reported. Asserted on the numbers, because the CSS that fixes it
     * is two easily-deleted lines.
     */
    // Wide enough to be past the 700px breakpoint: below it the layout is one
    // page scroller by design, and measuring that proves nothing about the
    // two-column case this check exists for.
    const lframe = await openFrame("/", "width:900px;height:600px");
    const lrail = lframe.contentDocument.getElementById("rail");
    const lstage = lframe.contentDocument.getElementById("stage");
    const viewport = lframe.contentWindow.innerHeight;
    lines.push(
      `      rail ${lrail.clientHeight}/${lrail.scrollHeight}, stage ${lstage.clientHeight}, viewport ${viewport}`,
    );
    check("the rail is taller than the viewport, as it should be",
      lrail.scrollHeight > lrail.clientHeight, true);
    check("but scrolls itself rather than the page",
      lrail.clientHeight <= viewport + 1, true);
    check("so the stage stays viewport height and keeps the picture in view",
      lstage.clientHeight <= viewport + 1, true);

    /**
     * A tall picture must not push the playback controls out of reach.
     *
     * The stage is a fixed-height pane that does not scroll, so anything the
     * canvas displaces is simply gone. Capping the canvas at the viewport was
     * not enough — it left no room for the play button and the timeline beneath
     * it. The picture now takes whatever height those do not need.
     *
     * Driven by giving the canvas a very tall bitmap rather than loading a
     * video, because the CSS contract is what is under test.
     */
    const tall = lframe.contentDocument;
    tall.getElementById("out").hidden = false;
    tall.getElementById("frame").hidden = false;
    tall.getElementById("play").hidden = false;
    tall.getElementById("timeline").hidden = false;
    tall.getElementById("out").width = 300;
    tall.getElementById("out").height = 4000;
    await new Promise((resolve) => setTimeout(resolve, 200));
    const lstage2 = tall.getElementById("stage");
    const playBox = tall.getElementById("play").getBoundingClientRect();
    const stageBox = lstage2.getBoundingClientRect();
    lines.push(
      `      tall picture: stage ${lstage2.clientHeight}/${lstage2.scrollHeight},` +
      ` play at ${Math.round(playBox.top)}–${Math.round(playBox.bottom)} of ${Math.round(stageBox.bottom)}`,
    );
    check("a very tall picture does not overflow the stage",
      lstage2.scrollHeight <= lstage2.clientHeight + 1, true);
    check("and the play button stays inside it",
      playBox.bottom <= stageBox.bottom + 1 && playBox.top >= stageBox.top - 1, true);
    lframe.remove();

    const uframe = await openFrame("/");
    check("a clean load writes nothing to the address bar",
      uframe.contentWindow.location.hash, "");
    const ufire = (id, value) => {
      const el = uframe.contentDocument.getElementById(id);
      el.value = value;
      el.dispatchEvent(new uframe.contentWindow.Event("change", { bubbles: true }));
    };
    ufire("algorithm", "bayer");
    ufire("outputMode", "duo");
    const carried = uframe.contentWindow.location.hash;
    lines.push(`      link carries ${carried}`);
    check("edits reach the address bar", carried.includes("algorithm=bayer"), true);
    uframe.remove();

    const rframe = await openFrame(`/${carried}`);
    check("and the link survives in the bar rather than vanishing",
      rframe.contentWindow.location.hash.includes("algorithm=bayer"), true);
    const restored = [
      rframe.contentDocument.getElementById("algorithm").value,
      rframe.contentDocument.getElementById("outputMode").value,
    ];
    lines.push(`      fresh load restored ${JSON.stringify(restored)}`);
    check("and a fresh load restores them", restored, ["bayer", "duo"]);
    rframe.remove();

    /**
     * Play and pause, driven through the real app with a real file.
     *
     * `playing` used to be a flag the button set and nothing ever corrected, so
     * an element that stopped on its own — a decode hiccup, a seek, the browser
     * reclaiming a codec — left the button reading "pause" over a frozen
     * picture, and the next click paused an already-paused element. Two clicks
     * to get anything, which is what "play/pause does not work" looks like.
     */
    /**
     * A picture smaller than the stage has to scale up to fill it.
     *
     * `max-width`/`max-height` only ever shrink, so a small photo was drawn at
     * its own pixel size in the middle of a large empty pane — which reads as
     * the app padding a background around it. The fit is computed, so the check
     * is that one axis is filled and the proportions are untouched.
     */
    stage("the picture fills the stage");
    {
      const fitFrame = await openFrame("/", "width:900px;height:600px");
      const fdoc = fitFrame.contentDocument;
      const tiny = document.createElement("canvas");
      tiny.width = 80;
      tiny.height = 60;
      const tctx = tiny.getContext("2d", { willReadFrequently: true });
      tctx.fillStyle = "#808080";
      tctx.fillRect(0, 0, 80, 60);
      const blob = await new Promise((resolve) => tiny.toBlob(resolve, "image/png"));
      const dt = new fitFrame.contentWindow.DataTransfer();
      dt.items.add(new fitFrame.contentWindow.File([blob], "tiny.png", { type: "image/png" }));
      const input = fdoc.getElementById("file");
      input.files = dt.files;
      input.dispatchEvent(new fitFrame.contentWindow.Event("change", { bubbles: true }));
      await new Promise((resolve) => setTimeout(resolve, 1800));

      const shown = fdoc.getElementById("out").getBoundingClientRect();
      const holder = fdoc.getElementById("frame").getBoundingClientRect();
      const fills = Math.max(shown.width / holder.width, shown.height / holder.height);
      const ratio = shown.width / shown.height;
      lines.push(`      an 80x60 picture shows at ${Math.round(shown.width)}x${Math.round(shown.height)} in a ${Math.round(holder.width)}x${Math.round(holder.height)} frame`);
      check("a small picture is scaled up to meet the frame", fills > 0.95, true);
      check("without being stretched", Math.abs(ratio - 80 / 60) < 0.05, true);
      check("and without overflowing it",
        shown.width <= holder.width + 1 && shown.height <= holder.height + 1, true);
      fitFrame.remove();
    }

    stage("play and pause");
    const pframe = await openFrame("/", "width:900px;height:600px");
    const pdoc = pframe.contentDocument;
    {
      const bytes = new Uint8Array(await fixture.arrayBuffer());
      const dt = new pframe.contentWindow.DataTransfer();
      dt.items.add(new pframe.contentWindow.File([bytes], "clip.mp4", { type: "video/mp4" }));
      const input = pdoc.getElementById("file");
      input.files = dt.files;
      input.dispatchEvent(new pframe.contentWindow.Event("change", { bubbles: true }));
    }
    await new Promise((resolve) => setTimeout(resolve, 2500));

    /**
     * The still preview of a video is its first frame, and it has to be the
     * real one.
     *
     * `loadeddata` means a frame is *decodable*, not that one has been painted,
     * so capturing there returned an opaque black bitmap: the picture came up
     * black — with whatever part of the frame had arrived showing as a band of
     * real image against it — and only corrected itself once play was pressed.
     * The fixture is a mid-grey field, so a correct first frame dithers to
     * something around half ink and a black one is unmistakable.
     */
    {
      const shown = pdoc.getElementById("out");
      const sd = shown.getContext("2d", { willReadFrequently: true })
        .getImageData(0, 0, shown.width, shown.height).data;
      let sum = 0;
      let n = 0;
      for (let i = 0; i < sd.length; i += 4) {
        sum += sd[i];
        n++;
      }
      const mean = sum / Math.max(1, n);
      lines.push(`      the first frame previews at mean ${mean.toFixed(0)} before play is pressed`);
      check("a video's first frame previews as the picture, not as black",
        mean > 40, true);
    }

    const playBtn = pdoc.getElementById("play");
    const scrubBar = pdoc.getElementById("scrub");
    const label = () => playBtn.textContent.trim();
    const idleLabel = label();

    playBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 1200));
    const playingLabel = label();
    const movedTo = Number(scrubBar.value);
    check("playing advances the clip", movedTo > 0, true);
    check("and the button offers to pause", playingLabel !== idleLabel, true);

    playBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 400));
    const heldAt = Number(scrubBar.value);
    check("pausing puts the button back", label(), idleLabel);
    await new Promise((resolve) => setTimeout(resolve, 500));
    check("and the clip actually stops", Number(scrubBar.value), heldAt);

    /**
     * The element stopping without the button is the case the flag used to get
     * wrong. Scrubbing does exactly that, so it is the honest way to reach it.
     */
    playBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 600));
    scrubBar.value = "200";
    scrubBar.dispatchEvent(new pframe.contentWindow.Event("input", { bubbles: true }));
    await new Promise((resolve) => setTimeout(resolve, 600));
    check("a stop the button did not cause still updates the button", label(), idleLabel);

    /**
     * The video controls have to be reachable without hunting for them.
     *
     * They used to sit at the bottom of the Export group, under the still-image
     * exports; once the pixel-size ladder was added they were a screen and a
     * half down the rail, which reads as the button having gone missing. They
     * are their own group now, near the top, and shown only for a video.
     */
    {
      const railEl = pdoc.getElementById("rail");
      const btn = pdoc.getElementById("exportVideo");
      const box = btn.getBoundingClientRect();
      const railBox = railEl.getBoundingClientRect();
      lines.push(`      video export sits at ${Math.round(box.top - railBox.top)}px into a ${Math.round(railBox.height)}px rail`);
      check("the video export is in view without scrolling the rail",
        box.top >= railBox.top - 1 && box.bottom <= railBox.bottom + 1, true);
      check("and it is hidden when the file is not a video",
        pdoc.getElementById("exportVideo").closest("details").hidden, false);
    }

    playBtn.click();
    await new Promise((resolve) => setTimeout(resolve, 900));
    lines.push(`      after one click from a stopped state: ${label()}, scrub ${scrubBar.value}`);
    check("and one click resumes rather than two",
      label() !== idleLabel && Number(scrubBar.value) > 200, true);
    pframe.remove();

    const report = document.getElementById("report");
    report.textContent = `${failed === 0 ? "all checks passed" : `${failed} FAILED`}\n\n${lines.filter((l) => !l.startsWith("....")).join("\n")}`;
    if (failed > 0) report.className = "fail";
    document.title = failed === 0 ? "ready" : "FAILED";
  </script>
</body>
